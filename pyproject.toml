[project]
name = "backline"
version = "0.1.0"
description = "Bass and drums generator for a guitar riff, driven by an explicit, editable harmonic plan."
readme = "README.md"
license = "AGPL-3.0-only"
license-files = ["LICENSE"]
authors = [{ name = "Ithinkimbulletproof (Fazanka Records)" }]
requires-python = ">=3.12,<3.13"
classifiers = [
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Sound/Audio :: MIDI",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "defusedxml>=0.7",
    "mido>=1.3",
    "numpy>=2.0",
    "pydantic>=2.10",
    "pydantic-settings>=2.6",
    "pyguitarpro>=0.10",
    "pyyaml>=6.0",
    "typer>=0.15",
]

[project.optional-dependencies]
# Pick exactly one torch build: `cuda` for local training, `cpu` for CI.
cpu = ["torch>=2.7", "tensorboard>=2.17", "peft>=0.13"]
cuda = ["torch>=2.7", "tensorboard>=2.17", "peft>=0.13"]
web = ["django>=5.2,<5.3", "huey>=2.5"]

[project.scripts]
backline = "backline.cli:app"

[project.urls]
Repository = "https://github.com/Ithinkimbulletproof/backline"

[dependency-groups]
dev = [
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-django>=4.9",
    "ruff>=0.8",
    "types-defusedxml>=0.7",
    "types-pyyaml>=6.0",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/backline"]

[tool.uv]
conflicts = [[{ extra = "cpu" }, { extra = "cuda" }]]

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cuda", extra = "cuda" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

# Blackwell GPUs (sm_120) need a CUDA 12.8+ build; change the suffix to match your driver.
[[tool.uv.index]]
name = "pytorch-cuda"
url = "https://download.pytorch.org/whl/cu132"
explicit = true

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "."]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "C4", "N", "PT", "PTH", "RUF", "TID"]
# The UI and docs are in Russian: Cyrillic letters are not confusables here.
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"django".msg = "The core package must not depend on Django: keep web code in web/."
"huey".msg = "The core package must not depend on the task queue: keep it in web/."

[tool.ruff.lint.per-file-ignores]
# Django declares models, admin options and Meta as class attributes by design.
"web/**" = ["TID251", "RUF012"]
"manage.py" = ["TID251"]
"tests/web/**" = ["TID251"]
"**/migrations/**" = ["E501", "RUF012"]
# `F` is the conventional alias of torch.nn.functional.
"src/backline/model/**" = ["N812"]

[tool.ruff.lint.isort]
known-first-party = ["backline", "web"]

[tool.mypy]
python_version = "3.12"
files = ["src/backline"]
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["guitarpro.*", "mido.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
DJANGO_SETTINGS_MODULE = "web.settings"
addopts = ["-ra", "--strict-markers"]
markers = [
    "slow: long-running tests",
    "gpu: tests that need a CUDA device",
]
