# Tiny profile for CI and quick local checks: runs end to end on a CPU in seconds.
extends: base.yaml

name: tiny

synth:
  n_songs: 12
  n_artists: 4

tokenizer:
  segment_bars: [2, 4]

model:
  d_model: 64
  n_layers: 2
  n_heads: 4
  context_length: 1024
  dropout: 0.0

train:
  batch_size: 4
  grad_accum: 1
  lr: 0.002
  warmup_steps: 5
  max_steps: 40
  eval_every: 20
  checkpoint_every: 20
  eval_batches: 4
  memorization_prompts: 2

adapter:
  rank: 4
  alpha: 8
  steps: 12
  batch_size: 4
  eval_every: 6
  reference_prompts: 2

generation:
  variants: 2
